name: collect-native-formats
on:
  workflow_dispatch:
  push:
    branches: ['codex/corpus-platform-expansion']
permissions:
  contents: read
concurrency:
  group: native-corpus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {runner: windows-2022, arch: x86_64, vcarch: amd64}
          - {runner: windows-2022, arch: x86, vcarch: x86}
          - {runner: windows-2022, arch: aarch64, vcarch: amd64_arm64}
          - {runner: macos-15, arch: aarch64}
          - {runner: macos-15, arch: x86_64}
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select exact installed MSVC target environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          cmd /s /c "`"$devcmd`" -no_logo -arch=${{ matrix.vcarch }} -host_arch=amd64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Collect pinned sources, binaries and debug artifacts twice
        run: python scripts/collect_native.py --arch ${{ matrix.arch }} --output corpus/native-${{ matrix.runner }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-${{ matrix.runner }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            corpus/native-*/attempts.jsonl
            corpus/native-*/builds/
            corpus/native-*/sources/*.tar
          retention-days: 30
