name: collect-native-formats
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Select the native acquisition campaign'
        type: choice
        options: [standard, windows, macos, macos-projects]
        default: standard
  push:
    branches: ['codex/corpus-platform-expansion']
    paths: ['scripts/collect_native.py', 'configs/native-projects.json', 'configs/native-projects-batch2.json']
permissions:
  contents: read
concurrency:
  group: native-corpus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ github.event_name == 'push' || inputs.campaign == 'standard' || inputs.campaign == '' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {runner: windows-2022, arch: x86_64, vcarch: amd64, profiles: 'O0 O2'}
          - {runner: windows-2022, arch: x86, vcarch: x86, profiles: 'O0 O2'}
          - {runner: windows-2022, arch: aarch64, vcarch: arm64, profiles: 'O0 O2'}
          - {runner: macos-15, arch: aarch64, profiles: 'O0 O2'}
          - {runner: macos-15, arch: x86_64, profiles: 'O0 O2'}
          - {runner: ubuntu-24.04, arch: x86_64, profiles: 'O0 O2 O3 Os'}
          - {runner: ubuntu-24.04-arm, arch: aarch64, profiles: 'O0 O2 O3 Os'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select exact installed MSVC target environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          cmd /s /c "`"$devcmd`" -no_logo -arch=${{ matrix.vcarch }} -host_arch=amd64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]; $value = $matches[2]
              if ($name -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsVersion|WindowsSDKVersion|VSCMD_ARG_TGT_ARCH|VSCMD_ARG_HOST_ARCH|VCINSTALLDIR|VSINSTALLDIR|UCRTVersion|WindowsSdkDir|WindowsSDKLibVersion|DevEnvDir)$') {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            } else { Write-Host $_ }
          }
      - name: Collect pinned sources, binaries and debug artifacts twice
        run: python scripts/collect_native.py --config configs/native-projects-batch2.json --profiles ${{ matrix.profiles }} --arch ${{ matrix.arch }} --output corpus/native-${{ matrix.runner }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-${{ matrix.runner }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            corpus/native-*/attempts.jsonl
            corpus/native-*/builds/
            corpus/native-*/sources/*.tar
          retention-days: 30
  windows-matrix:
    if: ${{ inputs.campaign == 'windows' }}
    uses: ./.github/workflows/collect-windows-matrix.yml
  macos-matrix:
    if: ${{ inputs.campaign == 'macos' }}
    uses: ./.github/workflows/collect-macos-matrix.yml
  macos-projects:
    if: ${{ inputs.campaign == 'macos-projects' }}
    uses: ./.github/workflows/collect-macos-projects.yml
