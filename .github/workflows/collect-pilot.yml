name: collect-pinned-linux-pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-pinned-linux-pilot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[publish]'
      - name: Fetch pinned builder
        run: docker pull --platform linux/amd64 "$(python -c 'import json; print(json.load(open("configs/pilot.json"))["image"])')"
      - name: Collect and replay
        run: python scripts/collect_pilot.py
      - name: Package metadata and payload
        run: python scripts/publish_pilot.py --corpus corpus/pilot --output shards/pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-pilot-evidence-${{ github.run_id }}
          path: |
            corpus/pilot/builds/
            corpus/pilot/builds.jsonl
            shards/pilot/
          retention-days: 30
      # Publishing stays a separate process with no build sandbox credentials.
