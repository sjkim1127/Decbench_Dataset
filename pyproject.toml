[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decbench-dataset"
version = "0.1.0"
description = "Reproducible multi-language binary corpus tooling for DecBench/Fission"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
decbench-dataset = "decbench_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
