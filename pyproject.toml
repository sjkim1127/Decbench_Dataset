[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decbench-dataset"
version = "0.2.0"
description = "Reproducible multi-language binary corpus tooling for DecBench/Fission"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
publish = ["huggingface_hub>=1.0,<2", "pyarrow>=18,<24", "jsonschema>=4.23,<5"]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
decbench-dataset = "decbench_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
